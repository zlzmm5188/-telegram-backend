<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Telegram客户端</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn:hover, .btn:active {
            background: #1976D2;
            transform: translateY(-2px);
        }
        .info {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Telegram多会话客户端</h1>
        
        <div class="info">
            <strong>🎉 手机测试版已准备就绪！</strong><br>
            支持多账号同时在线，避免掉号问题
        </div>
        
        <a href="/mobile" class="btn">🚀 开始使用</a>
        
        <div class="info">
            <strong>💡 使用提示：</strong><br>
            1. 点击上方按钮进入客户端<br>
            2. 输入会话标识（如：mobile1）<br>
            3. 完成Telegram登录验证<br>
            4. 开始使用多会话功能
        </div>
    </div>
</body>
</html>
