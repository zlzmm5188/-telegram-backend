<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram-TT 多会话启动器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2196F3;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .launcher-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #2196F3;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2196F3;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        .btn-warning {
            background: #ff9800;
            color: white;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .session-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        
        .session-card.active {
            border-color: #4CAF50;
            background: #f1f8e9;
        }
        
        .session-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .session-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.online {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.offline {
            background: #f44336;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .instructions {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .instructions h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        
        .instructions ol {
            margin-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        .log-area {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .log-entry.success {
            color: #4CAF50;
        }
        
        .log-entry.error {
            color: #f44336;
        }
        
        .log-entry.info {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Telegram-TT 多会话启动器</h1>
            <p>为每个子域名创建独立的Telegram客户端实例，避免会话冲突</p>
        </div>
        
        <div class="main-content">
            <div class="instructions">
                <h3>📋 使用说明</h3>
                <ol>
                    <li>输入子域名（例如：user1, user2等）</li>
                    <li>点击"启动新会话"创建独立的Telegram客户端</li>
                    <li>每个会话都有独立的存储和登录状态</li>
                    <li>可以同时运行多个会话，不会相互干扰</li>
                    <li>通过我们的API完成登录后，客户端会自动连接</li>
                </ol>
            </div>
            
            <div class="launcher-section">
                <h2>🆕 创建新会话</h2>
                <div class="form-group">
                    <label for="subdomain">子域名:</label>
                    <input type="text" id="subdomain" placeholder="例如: user1, user2, test..." value="user1">
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary" onclick="launchNewSession()">🚀 启动新会话</button>
                    <button class="btn btn-success" onclick="checkApiStatus()">🔍 检查API状态</button>
                    <button class="btn btn-warning" onclick="quickLogin()">⚡ 快速登录</button>
                    <button class="btn btn-info" onclick="openWebClient()">🌐 打开Web客户端</button>
                </div>
            </div>
            
            <div class="launcher-section">
                <h2>📱 活跃会话</h2>
                <div id="sessionsContainer" class="sessions-grid">
                    <!-- 会话卡片将在这里动态生成 -->
                </div>
            </div>
            
            <div class="launcher-section">
                <h2>📊 系统日志</h2>
                <div id="logArea" class="log-area">
                    <!-- 日志信息将在这里显示 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        class TelegramTTLauncher {
            constructor() {
                this.sessions = new Map();
                this.apiUrl = 'http://localhost:8000';
                this.telegramTTUrl = 'http://localhost:3000';
                this.logToArea('系统初始化完成', 'info');
                this.loadSavedSessions();
            }
            
            logToArea(message, type = 'info') {
                const logArea = document.getElementById('logArea');
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${type}`;
                logEntry.textContent = `[${timestamp}] ${message}`;
                logArea.appendChild(logEntry);
                logArea.scrollTop = logArea.scrollHeight;
                
                // 限制日志条数
                while (logArea.children.length > 100) {
                    logArea.removeChild(logArea.firstChild);
                }
            }
            
            async checkApiStatus() {
                const subdomain = document.getElementById('subdomain').value.trim();
                if (!subdomain) {
                    alert('请输入子域名');
                    return;
                }
                
                try {
                    this.logToArea(`检查子域名 ${subdomain} 的API状态...`, 'info');
                    
                    const response = await fetch(`${this.apiUrl}/session/status`, {
                        headers: {
                            'Host': `${subdomain}.example.com`
                        }
                    });
                    
                    const result = await response.json();
                    
                    if (result.authorized) {
                        const user = result.user;
                        this.logToArea(`✅ ${subdomain}: 已授权 - ${user.first_name} (@${user.username})`, 'success');
                    } else {
                        this.logToArea(`❌ ${subdomain}: 未授权 - ${result.reason}`, 'error');
                    }
                } catch (error) {
                    this.logToArea(`🔴 检查API状态失败: ${error.message}`, 'error');
                }
            }
            
            async quickLogin() {
                const subdomain = document.getElementById('subdomain').value.trim();
                if (!subdomain) {
                    alert('请输入子域名');
                    return;
                }
                
                const phone = prompt('请输入手机号:');
                if (!phone) return;
                
                try {
                    this.logToArea(`向 ${phone} 发送验证码...`, 'info');
                    
                    // 发送验证码
                    const codeResponse = await fetch(`${this.apiUrl}/send_code`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Host': `${subdomain}.example.com`
                        },
                        body: JSON.stringify({ phone: phone })
                    });
                    
                    const codeResult = await codeResponse.json();
                    
                    if (codeResult.success) {
                        this.logToArea(`✅ 验证码已发送到 ${phone}`, 'success');
                        
                        const code = prompt('请输入收到的验证码:');
                        if (!code) return;
                        
                        // 验证登录
                        const verifyResponse = await fetch(`${this.apiUrl}/verify`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Host': `${subdomain}.example.com`
                            },
                            body: JSON.stringify({ phone: phone, code: code })
                        });
                        
                        const verifyResult = await verifyResponse.json();
                        
                        if (verifyResult.success) {
                            this.logToArea(`🎉 ${subdomain} 登录成功!`, 'success');
                            alert('登录成功！现在可以启动客户端了');
                        } else {
                            this.logToArea(`❌ 登录失败: ${verifyResult.error}`, 'error');
                        }
                    } else {
                        this.logToArea(`❌ 发送验证码失败: ${codeResult.error}`, 'error');
                    }
                } catch (error) {
                    this.logToArea(`🔴 登录过程失败: ${error.message}`, 'error');
                }
            }
            
            launchNewSession() {
                const subdomain = document.getElementById('subdomain').value.trim();
                if (!subdomain) {
                    alert('请输入子域名');
                    return;
                }
                
                if (this.sessions.has(subdomain)) {
                    alert('该会话已存在！');
                    return;
                }
                
                this.logToArea(`🚀 启动新会话: ${subdomain}`, 'info');
                
                // 为每个子域名创建独立的URL参数
                const sessionUrl = `${this.telegramTTUrl}/?session=${subdomain}&subdomain=${subdomain}`;
                
                // 在新窗口中打开
                const newWindow = window.open(
                    sessionUrl,
                    `telegram-tt-${subdomain}`,
                    'width=1200,height=800,resizable=yes,scrollbars=yes'
                );
                
                if (newWindow) {
                    const sessionInfo = {
                        subdomain: subdomain,
                        window: newWindow,
                        startTime: new Date(),
                        status: 'starting'
                    };
                    
                    this.sessions.set(subdomain, sessionInfo);
                    this.updateSessionsDisplay();
                    this.saveSessions();
                    
                    // 监听窗口关闭
                    const checkClosed = setInterval(() => {
                        if (newWindow.closed) {
                            this.sessions.delete(subdomain);
                            this.updateSessionsDisplay();
                            this.saveSessions();
                            this.logToArea(`🔴 会话 ${subdomain} 已关闭`, 'info');
                            clearInterval(checkClosed);
                        }
                    }, 1000);
                    
                    this.logToArea(`✅ 会话 ${subdomain} 启动成功`, 'success');
                } else {
                    this.logToArea(`❌ 无法启动会话 ${subdomain} - 请检查弹窗拦截`, 'error');
                    alert('无法打开新窗口，请检查浏览器的弹窗拦截设置');
                }
            }
            
            openWebClient() {
                const subdomain = document.getElementById('subdomain').value.trim();
                if (!subdomain) {
                    alert('请输入子域名');
                    return;
                }
                
                // 打开我们自己的Web客户端
                const webClientUrl = `/workspace/telegram_web_client.html?subdomain=${subdomain}`;
                window.open(webClientUrl, `web-client-${subdomain}`, 'width=900,height=700');
                this.logToArea(`🌐 打开Web客户端: ${subdomain}`, 'info');
            }
            
            updateSessionsDisplay() {
                const container = document.getElementById('sessionsContainer');
                container.innerHTML = '';
                
                if (this.sessions.size === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">暂无活跃会话</p>';
                    return;
                }
                
                this.sessions.forEach((sessionInfo, subdomain) => {
                    const card = document.createElement('div');
                    card.className = 'session-card';
                    
                    const isActive = sessionInfo.window && !sessionInfo.window.closed;
                    if (isActive) {
                        card.classList.add('active');
                    }
                    
                    const startTime = sessionInfo.startTime.toLocaleTimeString();
                    
                    card.innerHTML = `
                        <div class="session-title">
                            <span class="status-indicator ${isActive ? 'online' : 'offline'}"></span>
                            ${subdomain}
                        </div>
                        <div class="session-info">
                            启动时间: ${startTime}<br>
                            状态: ${isActive ? '运行中' : '已关闭'}
                        </div>
                        <div>
                            ${isActive ? 
                                `<button class="btn btn-info" onclick="launcher.focusSession('${subdomain}')">🔍 切换到此会话</button>` :
                                `<button class="btn btn-primary" onclick="launcher.restartSession('${subdomain}')">🔄 重新启动</button>`
                            }
                            <button class="btn btn-warning" onclick="launcher.closeSession('${subdomain}')">❌ 关闭</button>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            }
            
            focusSession(subdomain) {
                const sessionInfo = this.sessions.get(subdomain);
                if (sessionInfo && sessionInfo.window && !sessionInfo.window.closed) {
                    sessionInfo.window.focus();
                    this.logToArea(`🔍 切换到会话: ${subdomain}`, 'info');
                } else {
                    this.logToArea(`❌ 会话 ${subdomain} 不可用`, 'error');
                    this.updateSessionsDisplay();
                }
            }
            
            closeSession(subdomain) {
                const sessionInfo = this.sessions.get(subdomain);
                if (sessionInfo && sessionInfo.window && !sessionInfo.window.closed) {
                    sessionInfo.window.close();
                }
                this.sessions.delete(subdomain);
                this.updateSessionsDisplay();
                this.saveSessions();
                this.logToArea(`❌ 已关闭会话: ${subdomain}`, 'info');
            }
            
            restartSession(subdomain) {
                this.closeSession(subdomain);
                document.getElementById('subdomain').value = subdomain;
                this.launchNewSession();
            }
            
            saveSessions() {
                const sessionData = Array.from(this.sessions.keys());
                localStorage.setItem('telegramTTSessions', JSON.stringify(sessionData));
            }
            
            loadSavedSessions() {
                try {
                    const savedSessions = localStorage.getItem('telegramTTSessions');
                    if (savedSessions) {
                        const sessionList = JSON.parse(savedSessions);
                        // 注意：重新加载时窗口引用会丢失，这里只是显示历史记录
                        sessionList.forEach(subdomain => {
                            this.sessions.set(subdomain, {
                                subdomain: subdomain,
                                window: null,
                                startTime: new Date(),
                                status: 'closed'
                            });
                        });
                        this.updateSessionsDisplay();
                    }
                } catch (error) {
                    this.logToArea(`⚠️ 加载历史会话失败: ${error.message}`, 'error');
                }
            }
        }
        
        // 全局函数
        const launcher = new TelegramTTLauncher();
        
        function launchNewSession() {
            launcher.launchNewSession();
        }
        
        function checkApiStatus() {
            launcher.checkApiStatus();
        }
        
        function quickLogin() {
            launcher.quickLogin();
        }
        
        function openWebClient() {
            launcher.openWebClient();
        }
        
        // 定期更新会话状态
        setInterval(() => {
            launcher.updateSessionsDisplay();
        }, 5000);
    </script>
</body>
</html>
